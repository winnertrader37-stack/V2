<script>
document.getElementById("verjs").textContent="OK";
const $=s=>document.querySelector(s),N=n=>440*2**((n-69)/12);
let idest,ac,R,dest,an,an2,nb,OFF=0,ig,rc=null,mi,sel=null,cur=0,playing=false,srcs=[],t0=0,zoom=50,ph=0,ps=0;
const T=['Vocal','Guitar','Keys','Drums'].map(n=>({n,c:[],vol:1,pan:0,mu:0,so:0}));
const cv=f=>{const c=new Float32Array(2048);for(let i=0;i<2048;i++)c[i]=f(i/1024-1);return c};
const WS=f=>{const n=ac.createWaveShaper();n.curve=cv(f);return n};
const G=()=>ac.createGain(),F=(t,f,q)=>{const n=ac.createBiquadFilter();n.type=t;n.frequency.value=f;if(q)n.Q.value=q;return n},
D=m=>{const n=ac.createDelay(2);n.delayTime.value=m;return n},
O=(t,f)=>{const o=ac.createOscillator();o.type=t;o.frequency.value=f;o.start();return o},
C=(th,r,at)=>{const c=ac.createDynamicsCompressor();c.threshold.value=th;c.ratio.value=r;if(at!=null)c.attack.value=at;return c},
LF=(o,d,p)=>{const g=G();g.gain.value=d;o.connect(g);g.connect(p);return g};
const ins=(a,b,s)=>{const i=G(),o=G();i.connect(a);b.connect(o);return{i,o,s}},
wet=(a,b,s)=>{const i=G(),o=G(),d=G(),w=G();w.gain.value=0;i.connect(d);d.connect(o);i.connect(a);b.connect(w);w.connect(o);return{i,o,s:v=>{w.gain.value=v;s&&s(v)}}};
const GT=low=>{const a=ac.createAnalyser(),g=G(),i=G(),o=G(),b=new Float32Array(256);let th=0;i.connect(a);i.connect(g);g.connect(o);
if(!OFF)setInterval(()=>{if(!th){g.gain.value=1;return}a.getFloatTimeDomainData(b);let s=0;for(const x of b)s+=x*x;g.gain.setTargetAtTime(Math.sqrt(s/256)<th?low:1,ac.currentTime,.03)},30);
return{i,o,s:v=>th=OFF?0:v*.1}};
const PS=q=>{const d=D(.06),o=O('sawtooth',10),g=LF(o,0,d.delayTime);return ins(d,d,v=>{const s=q?Math.round(v):v;g.gain.value=-(2**(s/12)-1)/20})};
// 25 effects: [name, builder, min, max, step]
const MK=[
['Equalizer',()=>{const f=F('peaking',3000,1);return ins(f,f,v=>f.gain.value=v*15)}],
['Compressor',()=>{const c=C(0,6);return ins(c,c,v=>c.threshold.value=-v*50)}],
['Reverb',()=>{const c=ac.createConvolver(),n=ac.sampleRate*2,b=ac.createBuffer(2,n,ac.sampleRate);for(let k=0;k<2;k++){const d=b.getChannelData(k);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)**3}c.buffer=b;return wet(c,c)}],
['Delay',()=>{const d=D(.3),f=G();f.gain.value=.4;d.connect(f);f.connect(d);return wet(d,d)}],
['Limiter',()=>{const c=C(0,20,0);c.knee.value=0;return ins(c,c,v=>c.threshold.value=-v*24)}],
['De-Esser',()=>{const f=F('peaking',6500,3);return ins(f,f,v=>f.gain.value=-v*18)}],
['Noise Gate',()=>GT(.02)],
['Auto-Tune (lite)',()=>PS(1),-12,12,1],
['Pitch Shifter',()=>PS(0),-12,12,.1],
['Chorus',()=>{const d=D(.025),o=O('sine',1.5);LF(o,.004,d.delayTime);return wet(d,d)}],

/* ===================== NAOL STUDIO · MELODY FOLLOWER v1 =====================
   Nothing in your existing code is removed. It only upgrades the AI Keys / Full Auto:
   - YIN pitch tracker (hop 128 samples ≈ 5.8 ms, parabolic interpolation → sub-cent pitch)
   - Note segmentation (pitch change, re-attack, silence) + onset refinement down to 8 samples (~0.36 ms)
   - Tuning detection (cents) → keyboard/guitar tuned to the singer, not to A=440
   - Pitch-follow (bend/glide inside each note) + loudness-follow (dynamics) per note

/* ---- UI ---- */
$('#ai-pr').insertAdjacentHTML('beforebegin',`
<div class="row"><label><input type="checkbox" id="mf-k" checked> Keys</label><label><input type="checkbox" id="mf-g" checked> Guitar</label><label><input type="checkbox" id="mf-d" checked> Drum pad</label><label><input type="checkbox" id="mf-r" checked> Ribbon</label><label><input type="checkbox" id="mf-j" checked> DJ</label><label><input type="checkbox" id="mf-f" checked> Effects</label></div>

<label>Pitch follow <input type="range" id="mf-b" min="0" max="1" step=".05" value=".7"></label>

/* ---- vocal → mono 22.05 kHz (Vocal track, else Guitar track, or the selected clip) ---- */
function vox(){const cs=(sel&&!sel.ai)?[sel]:(T[0].c.length?T[0].c:T[1].c).filter(c=>!c.ai);if(!cs.length)return null;
const t0=Math.min(...cs.map(c=>c.start)),te=Math.max(...cs.map(c=>c.start+c.dur)),dur=Math.min(te-t0,120),n=Math.floor(dur*SR),x=new Float32Array(n);

/* ---- YIN pitch tracker ---- */
async function pitch(x){

/* ---- onset refinement: steepest energy rise, 32-sample blocks then 8-sample blocks ---- */
function onset(x,a,b){const one=(a,b,k)=>{let bs=Math.max(0,a),bv=-1,pe=-1;for(let p=Math.max(0,a);p<Math.min(b,x.length-k);p+=k){let e=1e-9;for(let i=0;i<k;i++)e+=x[p+i]*x[p+i];if(pe>0){const r=Math.log(e/pe);if(r>bv){bv=r;bs=p}}pe=e}return bs};
const c=one(a,b,32);return one(c-64,c+32,8)}

function keyOf(w){const mc=w.reduce((a,b)=>a+b,0)/12;let best={r:0,m:0,s:-2};
for(let m=0;m<2;m++){const p=KP[m],mp=p.reduce((a,b)=>a+b,0)/12;for(let r=0;r<12;r++){let sxy=0,sx=0,sy=0;for(let i=0;i<12;i++){const x=w[i]-mc,y=p[(i-r+12)%12]-mp;sxy+=x*y;sx+=x*x;sy+=y*y}const s=sxy/Math.sqrt(sx*sy||1);if(s>best.s)best={r,m,s}}}return best}

/* ---- main: every instrument follows the voice ----

fill('#sg-1',k1,i=>k1=i);fill('#sg-2',k2,i=>k2=i,1);fill('#sg-g',g,i=>g=i);KXpickerUI(w);

w.querySelector('#sm-ok').onclick=()=>done({k:k1,k2,g});w.querySelector('#sm-x').onclick=()=>done(null)})}
const mkNoise=oc=>{const sr=oc.sampleRate,b=oc.createBuffer(1,sr,sr),d=b.getChannelData(0);for(let i=0;i<sr;i++)d[i]=Math.random()*2-1;return b};
async function follow(){
init();const v=vox();if(!v||v.dur<2){lg('Record/import vocal (Vocal track) ≥ 2 s first');return}
const use={k:$('#mf-k').checked,g:$('#mf-g').checked,d:$('#mf-d').checked,r:$('#mf-r').checked,j:$('#mf-j').checked,f:$('#mf-f').checked};
if(!Object.values(use).some(Boolean)){lg('Pick at least one instrument');return}
let SEL=null;if(use.k||use.g){SEL=await askSound();if(!SEL){lg('Cancelled');return}if(use.k){setS1(SEL.k);KS.s2=SEL.k2;lcd()}if(use.g)$('#gsn').value=SEL.g}

const synth=(X,list,lo,hi)=>notes.forEach(o=>{let nn=o.n;while(nn<lo)nn+=12;while(nn>hi)nn-=12;
list.forEach(([S,oc2,vl])=>{melTone(X,o,nn+oc2*12,S,vl);if(har)melTone(X,o,nn+oc2*12+(inS(nn+4)?4:inS(nn+3)?3:4),S,vl*.5)});

// ---- drum pad (hits on the exact onsets) + DJ (risers before phrases, scratches after) ----
const perc=X=>{const oc=X.oc,nz=mkNoise(oc),
dh=(i,t,vv)=>{t=Math.max(0,t);const[,ty,f]=DR[i],g2=oc.createGain();g2.connect(X.mg);
